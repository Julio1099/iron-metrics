apiVersion: apps/v1
kind: Deployment
metadata:
  name: iron-metrics-api
  labels:
    app.kubernetes.io/name: iron-metrics-api
    app.kubernetes.io/part-of: iron-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iron-metrics-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iron-metrics-api
        app.kubernetes.io/part-of: iron-metrics
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: iron-metrics-api
          image: iron-metrics:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: iron-metrics-api-config
            - secretRef:
                name: iron-metrics-api-secret
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: iron-metrics-api
  labels:
    app.kubernetes.io/name: iron-metrics-api
    app.kubernetes.io/part-of: iron-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iron-metrics-api
  ports:
    - name: http
      port: 8080
      targetPort: http
