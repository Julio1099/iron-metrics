apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iron-metrics-postgres-data
  labels:
    app.kubernetes.io/name: iron-metrics-postgres
    app.kubernetes.io/part-of: iron-metrics
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iron-metrics-postgres
  labels:
    app.kubernetes.io/name: iron-metrics-postgres
    app.kubernetes.io/part-of: iron-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iron-metrics-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iron-metrics-postgres
        app.kubernetes.io/part-of: iron-metrics
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: iron_metrics
            - name: POSTGRES_USER
              value: iron_metrics
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iron-metrics-api-secret
                  key: IRON_METRICS_DB_PASSWORD
            - name: TZ
              value: UTC
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iron_metrics
                - -d
                - iron_metrics
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - iron_metrics
                - -d
                - iron_metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: iron-metrics-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: iron-metrics-postgres
  labels:
    app.kubernetes.io/name: iron-metrics-postgres
    app.kubernetes.io/part-of: iron-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iron-metrics-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
