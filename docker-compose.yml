services:
  postgres:
    image: postgres:16-alpine
    container_name: iron-metrics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iron_metrics
      POSTGRES_USER: iron_metrics
      POSTGRES_PASSWORD: iron_metrics_dev_password
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - iron_metrics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iron_metrics -d iron_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  iron_metrics_postgres_data:
