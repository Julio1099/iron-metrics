spring:
  application:
    name: iron-metrics
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${IRON_METRICS_DB_URL:jdbc:postgresql://localhost:5432/iron_metrics}
    username: ${IRON_METRICS_DB_USER:iron_metrics}
    password: ${IRON_METRICS_DB_PASSWORD:iron_metrics_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    default-schema: public
    schemas:
      - public
      - analytics
    create-schemas: true
    locations:
      - classpath:db/migration/core

server:
  shutdown: graceful
  servlet:
    context-path: /api/v1
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

iron-metrics:
  security:
    jwt:
      issuer: ${IRON_METRICS_JWT_ISSUER:iron-metrics}
      secret: ${IRON_METRICS_JWT_SECRET:iron-metrics-local-development-secret-key-with-at-least-256-bits}
      access-token-ttl: ${IRON_METRICS_JWT_ACCESS_TOKEN_TTL:PT1H}
    cors:
      allowed-origins: ${IRON_METRICS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type
      exposed-headers: Location
  rate-limit:
    auth:
      capacity: ${IRON_METRICS_RATE_LIMIT_AUTH_CAPACITY:20}
      refill-tokens: ${IRON_METRICS_RATE_LIMIT_AUTH_REFILL_TOKENS:20}
      refill-period: ${IRON_METRICS_RATE_LIMIT_AUTH_REFILL_PERIOD:PT1M}
    authenticated:
      capacity: ${IRON_METRICS_RATE_LIMIT_AUTHENTICATED_CAPACITY:120}
      refill-tokens: ${IRON_METRICS_RATE_LIMIT_AUTHENTICATED_REFILL_TOKENS:120}
      refill-period: ${IRON_METRICS_RATE_LIMIT_AUTHENTICATED_REFILL_PERIOD:PT1M}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations:
      - classpath:db/migration/core
      - classpath:db/migration/dev
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${IRON_METRICS_DB_URL}
    username: ${IRON_METRICS_DB_USER}
    password: ${IRON_METRICS_DB_PASSWORD}
  flyway:
    locations:
      - classpath:db/migration/core
  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.SQL: off

iron-metrics:
  security:
    cors:
      allowed-origins: ${IRON_METRICS_CORS_ALLOWED_ORIGINS}
